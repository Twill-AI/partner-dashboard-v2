<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twill — Partner Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    background: #0D0D0D;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Ambient background glow */
  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 600px;
    background: radial-gradient(ellipse, rgba(201,168,0,0.07) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    left: 20%;
    width: 600px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(99,102,241,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Subtle grid texture */
  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 10;
    width: 420px;
    background: rgba(18, 18, 18, 0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 48px 44px 44px;
    backdrop-filter: blur(20px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 40px 80px rgba(0,0,0,0.6),
      0 0 60px rgba(201,168,0,0.04);
  }

  .logo-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 32px;
  }

  .logo-wrap img {
    height: 36px;
    width: auto;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,0,0.4), transparent);
    margin: 0 auto 28px;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    color: #F5F5F5;
    text-align: center;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.38);
    text-align: center;
    margin-bottom: 32px;
    line-height: 1.5;
  }

  .field {
    position: relative;
    margin-bottom: 14px;
  }

  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 13px 16px;
    font-size: 14px;
    color: #F0F0F0;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    letter-spacing: 0.08em;
  }

  .field input::placeholder { color: rgba(255,255,255,0.2); letter-spacing: normal; }

  .field input:focus {
    border-color: rgba(201,168,0,0.5);
    box-shadow: 0 0 0 3px rgba(201,168,0,0.08);
  }

  .field input.error {
    border-color: rgba(239,68,68,0.5);
    box-shadow: 0 0 0 3px rgba(239,68,68,0.08);
  }

  .error-msg {
    display: none;
    font-size: 12px;
    color: #EF4444;
    margin-top: 8px;
    padding-left: 2px;
  }
  .error-msg.show { display: block; }

  .btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #C9A800, #A88C00);
    border: none;
    border-radius: 10px;
    color: #09090A;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    margin-top: 8px;
    letter-spacing: 0.01em;
  }

  .btn:hover { opacity: 0.92; }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .footer {
    margin-top: 32px;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .shake { animation: shake 0.4s ease; }
</style>
</head>
<body>
<div class="bg-grid"></div>

<div class="card">
  <div class="logo-wrap">
    <img src="/twill_logo_dark.png" alt="Twill" />
  </div>

  <div class="divider"></div>

  <h1>Partner Dashboard</h1>
  <p class="subtitle">Enter your access code to continue</p>

  <form id="loginForm" method="POST" action="/api/login">
    <div class="field">
      <label>Access Code</label>
      <input
        type="password"
        name="password"
        id="passwordInput"
        placeholder="••••••••••••••••"
        autocomplete="current-password"
        autofocus
        required
      />
      <div class="error-msg" id="errorMsg">Incorrect access code. Try again.</div>
    </div>
    <button type="submit" class="btn" id="submitBtn">Continue</button>
  </form>

  <div class="footer">Twill Payments · Confidential demo</div>
</div>

<script>
  // Show error if redirected back with ?error=1
  if (location.search.includes('error=1')) {
    document.getElementById('errorMsg').classList.add('show');
    document.getElementById('passwordInput').classList.add('error');
    document.querySelector('.card').classList.add('shake');
  }

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Checking…';
  });
</script>
</body>
</html>
